; Queue worker inside the web machine. The queue name comes from DB_QUEUE.
[program:queue]
priority=20
autostart=true
autorestart=true
user=www-data
command=/bin/sh -c 'exec php /var/www/html/artisan queue:work database --queue="${DB_QUEUE:-default}" --sleep=5 --tries=3 --timeout=30 --max-time=3600 --memory=128'
stopwaitsecs=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
